<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceviz Satış</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html"><img src="images/logo.jpg" alt="Ceviz Bahçesi Logosu" class="logo"></a>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Ana Sayfa</a></li>
                    <li><a href="about.html">Hakkında</a></li>
                    <li><a href="ceviz-satis.html">Ceviz Satış</a></li>
                    <li><a href="contact.html">İletişim</a></li>
                </ul>
            </nav>

    </header>
    <main>
        <section class="container" style="margin-top: 100px;">
            <h1>Ceviz Satış</h1>
            <section class="products">
                <div class="product">
                    <img src="images/sat.jpg" alt="Ceviz Ürünü" class="responsive-img" style="max-width: 300px; height: auto;">

    </main>
    <footer>
        <div class="container">
            <p>&copy; trceviz - Mahmut Torlak - 0533 519 52 22 </p>
        </div>
    </footer>
    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navList = document.querySelector('nav ul');
        mobileMenu.addEventListener('click', function() {
            navList.classList.toggle('active');
            mobileMenu.classList.toggle('is-active');
        });
    </script>
</body>
</html>
